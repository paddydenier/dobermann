[project]
name = "dobermann"
version = "0.3.1"
description = "Modern python library for discourse segmentation."
readme = "README.md"
authors = [
    { name = "Paddy Denier", email = "202327146+paddydenier@users.noreply.github.com" }
]
requires-python = ">=3.12"

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "spacy>=3.8.14",
    "nltk>=3.9.4",
    "sentence-transformers>=5.4.1",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "transformers>=5.5.4",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "httpx2>=2.12.0",
    "deptry>=0.25.1",
]

docs = [
    "sphinx>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# ruff defaults, plus enforcing explicit file encodings (preview rule),
# sorted imports and the public import boundaries
select = ["E4", "E7", "E9", "F", "PLW1514", "I", "TID251", "TID252"]

[tool.ruff.lint.per-file-ignores]
# TID251 also resolves relative imports, so the package itself is exempt
"src/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dobermann.segmenters.base".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.community".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.graph".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.labeling".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.postprocessor".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.similarity_matrix".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.smoothing".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.graphseg".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.graphseg.graphseg_embeddings".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.boundaries".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.postprocessor".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.similarity".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.smoothing".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.texttiling".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.segmenters.texttiling.texttiling_embeddings".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.embeddings.base".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.embeddings.sentence_transformer".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.preprocessors.base".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.preprocessors.identity".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
"dobermann.evaluators.segmentation_evaluator".msg = "Import from the public `dobermann` namespace (or `dobermann.segmenters.texttiling` / `.graphseg`) instead."
